---
- name: Configure Prometheus Alert Rules
  hosts: prometheus_servers
  tasks:
    - name: Create alert_rules.yml
      copy:
        dest: /etc/prometheus/alert_rules.yml
        content: |
          groups:
            - name: node_alerts
              rules:
                - alert: InstanceDown
                  expr: up{job="node_exporter"} == 0
                  for: 30s
                  labels:
                    severity: critical
                  annotations:
                    summary: "Node Exporter down on {{ $labels.instance }}"
                    description: "{{ $labels.instance }} has been unreachable for more than 30 seconds."

                - alert: HighCpuLoad
                  expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 80
                  for: 1m
                  labels:
                    severity: warning
                  annotations:
                    summary: "High CPU usage on {{ $labels.instance }}"
                    description: "CPU utilization on {{ $labels.instance }} exceeded 80%."

    - name: Update prometheus.yml to include rule_files
      copy:
        dest: /etc/prometheus/prometheus.yml
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          rule_files:
            - /etc/prometheus/alert_rules.yml

          scrape_configs:
            - job_name: 'node_exporter'
              static_configs:
                - targets:
                  - '192.168.69.201:9100'
                  - '192.168.69.202:9100'
                  - '192.168.69.203:9100'

    - name: Restart Prometheus service
      systemd:
        name: prometheus
        state: restarted
