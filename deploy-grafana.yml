---
- name: Deploy and Configure Grafana
  hosts: prometheus_servers
  tasks:
    - name: Download Grafana deb package
      get_url:
        url: https://dl.grafana.com/enterprise/release/grafana-enterprise_10.0.3_amd64.deb
        dest: /tmp/grafana.deb
        mode: '0644'

    - name: Install Grafana package
      apt:
        deb: /tmp/grafana.deb
        state: present

    - name: Ensure provisioning datasources directory exists
      file:
        path: /etc/grafana/provisioning/datasources
        state: directory
        owner: root
        group: grafana
        mode: '0755'

    - name: Provision Prometheus Datasource
      copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yaml
        owner: root
        group: grafana
        mode: '0640'
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://localhost:9090
              isDefault: true
              editable: true

    - name: Enable and restart Grafana service
      systemd:
        name: grafana-server
        state: restarted
        enabled: yes
        daemon_reload: yes
