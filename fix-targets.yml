---
- name: Fix Repositories and Networking on Target Nodes
  hosts: monitored_nodes
  tasks:
    - name: Update sources.list to snapshot archive
      copy:
        dest: /etc/apt/sources.list
        content: |
          deb [trusted=yes] http://snapshot.debian.org/archive/debian/20230630T000000Z/ buster main contrib non-free
          deb [trusted=yes] http://snapshot.debian.org/archive/debian-security/20230630T000000Z/ buster/updates main contrib non-free

    - name: Configure APT flags to bypass expired release timestamps
      copy:
        dest: /etc/apt/apt.conf.d/99snapshot
        content: |
          Acquire::Check-Valid-Until "false";
          Acquire::ForceIPv4 "true";
          Acquire::http::Pipeline-Depth "0";
          Acquire::http::No-Cache "true";
          Acquire::BrokenProxy "true";

    - name: Remove stale APT lists
      shell: rm -rf /var/lib/apt/lists/* && apt-get clean

    - name: Set MTU to 1200 on eth0 to prevent packet drops
      shell: ip link set dev eth0 mtu 1200
